       let n1 = Number.parseInt(window.prompt("Digite um numero: ")); // Number.parseInt transforma em numero inteiro
        let n2 = Number.parseInt(window.prompt("Digite outro numero: ")); // Number.parseFloat transforma em numero flutuante
        // Posso tambem só usar Number e o JS se vira

        let n4 = Number(window.prompt("Digite outro numero: "));
        let soma = (n1 + n2 + n3 + n4); // Soma os dois numero convertidos anteriormente
        window.alert(`A soma entre ${n1}, ${n2}, ${n3} e ${n4} da ${soma}`); //Imprime a variavel soma
        
        
        /* Para converter para String (n é a coisa a ver convertida)
