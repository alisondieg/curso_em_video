<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title>
    <style>
        body {
            background-color: rgb(78, 118, 250);
            color: white;
            font: normal 20pt Arial;
        }

        h1 {
            color: yellow;
        }
    </style>
</head>

<body>
    <h1>Olá mundo</h1>
    <p>Já me livrei da maldição</p>
    <script>
        let nome = window.prompt("Qual é seu nome? ");// salva a entrada do usuário na variável nome
        window.alert("É um grande prazer te conhecer " + nome + "!"); //Concatenação com a variável nome
    </script>
</body>

</html>
